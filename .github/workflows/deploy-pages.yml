name: Deploy GitHub Pages

on:
  push:
    branches: [ "master" ]
    paths:
      - "Eede/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を防止
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Publish WebAssembly SPA
        run: |
          dotnet publish Eede.Presentation.Browser/Eede.Presentation.Browser.csproj -c Release -o ./publish_temp
          mkdir -p ./docs/app
          cp -r ./publish_temp/wwwroot/* ./docs/app/
          rm -rf ./publish_temp

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
