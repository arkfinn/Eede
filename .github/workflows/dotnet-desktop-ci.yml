name: .NET Core Desktop CI

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "**.md"

jobs:
  test:
    strategy:
      matrix:
        configuration: [Debug]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install .NET 10 for desktop testing
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test Eede.Tests/Eede.Tests.csproj --configuration ${{ matrix.configuration }} --logger "console;verbosity=normal"
