<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G5FWMCKBSD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-G5FWMCKBSD');
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Eede - Web Edition</title>
    <base href="./" />
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="apple-touch-icon" href="../assets/logo.png" />
    <link rel="manifest" href="./manifest.json" />
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --border-color: #1e293b;
            --accent-emerald: #10b981;
            --accent-teal: #2dd4bf;
            --text-color: #f1f5f9;
            --text-muted: #64748b;
        }

        html, body, #out {
            touch-action: none;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #out {
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            display: block;
        }

        #portrait-warning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(2, 6, 23, 0.96);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }
        @media (orientation: portrait) and (pointer: coarse) {
            #portrait-warning:not(.dismissed) { display: flex; }
        }
        .portrait-warning-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .portrait-warning-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .portrait-dismiss-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo-title {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--accent-emerald), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0.5rem;
        }

        .logo-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
            letter-spacing: 0.05em;
        }

        .progress-container {
            width: 280px;
            height: 6px;
            background: #1e293b;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-emerald), var(--accent-teal));
            animation: pulse-loading 1.5s infinite ease-in-out;
            transform-origin: left;
        }

        @keyframes pulse-loading {
            0% { transform: scaleX(0.15) translateX(-50%); }
            50% { transform: scaleX(0.6) translateX(50%); }
            100% { transform: scaleX(0.15) translateX(350%); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 1rem;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="portrait-warning" role="dialog" aria-label="Orientation Notice">
        <div class="portrait-warning-title">横画面にしてご利用ください</div>
        <div class="portrait-warning-sub">Please rotate your device to landscape</div>
        <button type="button" class="portrait-dismiss-btn" onclick="document.getElementById('portrait-warning').classList.add('dismissed')">このまま表示 / Dismiss</button>
    </div>

    <div id="loading-screen">
        <div class="logo-container">
            <img src="../assets/logo.png" alt="Eede Logo" width="64" height="64" style="image-rendering: pixelated;" onerror="this.style.display='none'" />
            <div class="logo-title">Eede Web</div>
            <div class="logo-subtitle">Excellent Expert Dot Editor (WebAssembly)</div>
        </div>
        <div class="progress-container">
            <div class="progress-bar-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-text" id="loading-text">Loading WebAssembly Runtime...</div>
    </div>

    <div id="out"></div>

    <script type="module" src="./main.js"></script>
</body>
</html>
